services:
  node:
    container_name: odziez-robocza-node
    build:
      context: .docker/node
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./:/app
    networks:
      odziez-robocza-network:
    stdin_open: true
    tty: true
    command: tail -f /dev/null

networks:
  odziez-robocza-network:
    driver: bridge
